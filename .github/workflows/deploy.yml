name: Despliegue desde main
# Publica el Worker de Chedex en Cloudflare cuando cambia main y las comprobaciones pasan.
# Requiere el secreto CLOUDFLARE_API_TOKEN (permiso «Editar Workers») en Settings > Secrets and variables > Actions.
# Si el secreto no existe, el trabajo avisa y no despliega; nunca imprime ni guarda credenciales.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-chedex
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run animations:check
      - run: npm test
      - run: npm run deploy:check
  deploy:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Comprobar el secreto de Cloudflare
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Despliegue omitido::Falta el secreto CLOUDFLARE_API_TOKEN en el repositorio. Añádelo para que main se despliegue solo."
          fi
      - name: Desplegar en Cloudflare
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - name: Comprobar el sitio publicado
        if: steps.token.outputs.present == 'true'
        run: node scripts/monitor-production.mjs
